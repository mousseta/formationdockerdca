# api-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: api
        image: mousse2025/api:latest
        ports:
        - containerPort: 5000
        env:
        - name: KAFKA_BROKER
          value: "kafka:9092"
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  type: NodePort        # accessible depuis l'extérieur
  selector:
    app: api
  ports:
  - port: 5000
    targetPort: 5000
    nodePort: 30500     # http://<IP_NODE>:30500