apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      initContainers:
      # 1. PREMIER INIT : On règle les droits d'écriture sur le disque
      - name: fix-permissions
        image: busybox
        command: ["sh", "-c", "chown -R 1000:1000 /var/lib/kafka/data"]
        securityContext:
          runAsUser: 0
        volumeMounts:
        - name: kafka-storage
          mountPath: /var/lib/kafka/data

      # NOTE : La création des topics (kafka-init) ne peut pas se faire ICI
      # car Kafka doit être RUNNING pour accepter les commandes de création.
      # C'est pour cela que dans K8s, on met l'init des topics dans le pod du CONSUMER.
      
      containers:
      - name: kafka
        image: apache/kafka:3.7.0
        ports:
          - containerPort: 9092
          - containerPort: 9093
        env:
        - name: CLUSTER_ID
          value: "LTzrVJZ8RDiDoeDoQJbt7Q"
        - name: KAFKA_NODE_ID
          value: "1"
        - name: KAFKA_PROCESS_ROLES
          value: "broker,controller"
        - name: KAFKA_LISTENERS
          value: "PLAINTEXT://:9092,CONTROLLER://:9093"
        - name: KAFKA_ADVERTISED_LISTENERS
          value: "PLAINTEXT://kafka:9092"
        - name: KAFKA_CONTROLLER_QUORUM_VOTERS
          value: "1@kafka:9093"
        - name: KAFKA_CONTROLLER_LISTENER_NAMES
          value: "CONTROLLER"
        - name: KAFKA_LOG_DIRS
          value: "/var/lib/kafka/data"
        volumeMounts:
        - name: kafka-storage
          mountPath: /var/lib/kafka/data
      volumes:
      - name: kafka-storage
        hostPath:
          path: /data/kafka-data
          type: DirectoryOrCreate